<!doctype html>
<html lang="tr"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EMG MUHASEBE</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#4f8cff}
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh}
  #topbar{display:flex;align-items:center;gap:6px;background:var(--panel);border-bottom:1px solid var(--border);padding:10px 16px;position:sticky;top:0;z-index:10;flex-wrap:wrap}
  .brand{font-size:16px;font-weight:700;margin-right:14px;white-space:nowrap}
  #topbar nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  #topbar a{color:var(--text);text-decoration:none;padding:6px 10px;border-radius:6px;font-size:14px;cursor:pointer;white-space:nowrap}
  #topbar a:hover,#topbar a.active{background:#1f2937;color:var(--accent)}
  #account{margin-left:auto;display:flex;align-items:center;gap:12px}
  #account .who{font-size:12px;color:var(--muted);white-space:nowrap}
  main{flex:1;padding:24px;overflow:auto} h2{margin:0 0 4px} .muted{color:var(--muted)}
  table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px} th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border)}
  th{color:var(--muted)} button{font:inherit;cursor:pointer;background:#1f2937;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 12px}
  button.p{background:var(--accent);border-color:var(--accent);color:#fff} input{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 8px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
</style></head>
<body><header id="topbar"><div class="brand">EMG MUHASEBE</div><nav id="menu"></nav><div id="account"></div></header><main id="main"><p class="muted">Yükleniyor…</p></main>
<script type="module" src="/app.mjs"></script></body></html>
