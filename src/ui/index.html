<!doctype html>
<html lang="tr"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EMG MUHASEBE</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#4f8cff}
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
  aside{width:240px;background:var(--panel);border-right:1px solid var(--border);padding:16px;flex-shrink:0;display:flex;flex-direction:column}
  aside nav{display:flex;flex-direction:column;flex:1;min-height:0}
  aside h1{font-size:16px;margin:0 0 16px} .grp{color:var(--muted);font-size:11px;text-transform:uppercase;margin:14px 0 6px}
  .grp.account{margin-top:auto;padding-top:14px;border-top:1px solid var(--border)}
  aside a{display:block;color:var(--text);text-decoration:none;padding:6px 8px;border-radius:6px;font-size:14px;cursor:pointer}
  aside a:hover,aside a.active{background:#1f2937;color:var(--accent)}
  main{flex:1;padding:24px;overflow:auto} h2{margin:0 0 4px} .muted{color:var(--muted)}
  table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px} th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border)}
  th{color:var(--muted)} button{font:inherit;cursor:pointer;background:#1f2937;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 12px}
  button.p{background:var(--accent);border-color:var(--accent);color:#fff} input{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 8px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
</style></head>
<body><aside><h1>EMG MUHASEBE</h1><nav id="menu"></nav></aside><main id="main"><p class="muted">Yükleniyor…</p></main>
<script type="module" src="/app.mjs"></script></body></html>
